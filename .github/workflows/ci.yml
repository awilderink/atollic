name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Needed so `changeset status --since=origin/main` can diff against main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Check for changeset
        if: github.event_name == 'pull_request'
        run: bunx changeset status --since=origin/main

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Build example (elysia)
        working-directory: examples/elysia
        run: bunx --bun vite build

      - name: Build example (hono)
        working-directory: examples/hono
        run: bunx --bun vite build
