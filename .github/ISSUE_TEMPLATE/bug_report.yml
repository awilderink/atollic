name: Bug report
description: Something isn't working as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in what you can —
        the more context, the faster it can be fixed.

  - type: input
    id: version
    attributes:
      label: atollic version
      description: Output of `npm ls atollic` (or the version from your lockfile).
      placeholder: "0.0.3"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Bun
        - Node
        - Deno
        - Cloudflare Workers
        - Other (specify in description)
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: Server adapter
      options:
        - atollic/elysia
        - atollic/hono
        - Custom / none
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: UI framework adapter
      options:
        - atollic/solid
        - Custom
        - None (server HTML only)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        Ideally a link to a minimal repo or a StackBlitz / code snippet.
        Bugs without a reproduction may be closed.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / errors
      render: shell
